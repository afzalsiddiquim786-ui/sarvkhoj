name: Build SarvKhoj apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows, cmd: dist:win, files: "dist/*.exe" }
          - { os: macos-latest,   name: macOS,   cmd: dist:mac, files: "dist/*.dmg" }
          - { os: ubuntu-latest,  name: Linux,   cmd: dist:linux, files: "dist/*.AppImage\ndist/*.deb" }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: SarvKhoj-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: SarvKhoj-Android
          path: dist/*.apk
          if-no-files-found: error

  web:
    name: Web app (PWA, also for iPhone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:web
      - uses: actions/upload-artifact@v4
        with:
          name: SarvKhoj-Web
          path: www/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: 'SarvKhoj-*', merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.dmg
            out/*.AppImage
            out/*.deb
            out/*.apk
